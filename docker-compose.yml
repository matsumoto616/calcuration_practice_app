version: '3'
services:
  frontend:
    build: ./frontend
    ports:
      - "8080:8080"  # ローカル環境で使うポート
    volumes:
      - ./frontend:/app
      - /app/node_modules  # node_modules をマウント対象から除外
    container_name: vue_frontend
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - db_data:/app/quiz_app.db
    container_name: flask_backend
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"      # HTTPアクセス用
      - "443:443"    # HTTPSアクセス用
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Nginx設定ファイルを追加
      - /etc/letsencrypt:/etc/letsencrypt   # Let's Encryptの証明書をマウント
    depends_on:
      - frontend
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
